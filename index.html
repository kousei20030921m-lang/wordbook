<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wordbook</title>
<meta name="description" content="A personal English wordbook.">
<meta name="theme-color" content="#f4f1ea">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wordbook">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root {
  --paper: #f4f1ea;
  --paper-deep: #ebe6da;
  --ink: #1d1b18;
  --ink-2: #57524a;
  --ink-3: #8c8578;
  --rule: #d6d0c3;
  --danger: #9b3a26;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", Meiryo, system-ui, sans-serif;
  --gutter: 24px;
  --col: 600px;
  --safe-t: env(safe-area-inset-top, 0px);

  /* ---- tab bar: the five knobs tuned in tabbar-lab.html ---- */
  --tb-blur: 16px;          /* how much the content behind the bar smears */
  --tb-tint: 0.8;           /* darkness of the glass (0 = clear, 1 = solid) */
  --tb-move-ms: 170;        /* travel time of the lens between tabs */
  --tb-lens-scale: 1.18;    /* how much the pill swells when it lifts into a lens */
  --tb-rim: 0.24;           /* brightness of the thin light edge */
  /* secondary knobs */
  --tb-icon-scale: 1.14;
  --tb-pill: 0.16;
  --tb-lift-ms: 110;
  --tb-hold-ms: 70;
  --tb-settle-ms: 240;

  /* 60pt tall, 22pt above the bottom edge (reference video 90px/33px at 1.5x) */
  --bar-h: 60px;
  --bar-bottom: max(22px, calc(env(safe-area-inset-bottom, 0px) - 12px));
  --bar-side: 5.6vw;
  --bar-space: calc(var(--bar-h) + var(--bar-bottom) + 28px);

  /* ---- review card: knobs tuned in review-lab.html ---- */
  --rv-flip-ms: 200;       /* whole flip: old face narrows to the centre, new face widens */
  --rv-tilt: 4;            /* degrees the Got it / Not yet stamp leans (Got it clockwise) */
  --rv-scale: 1.1;         /* stamp size relative to the card */
  --rv-in-ms: 100;         /* stamp fade-in */
  --rv-hold-ms: 300;       /* stamp stays still */
  --rv-out-ms: 240;        /* stamp drops away */
  --rv-drop: 90;           /* px the stamp falls while leaving */
  --rv-out-scale: 0.55;    /* stamp size when it is gone */
  --rv-radius: 34px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  font-feature-settings: "palt" 0;
}
/* paper grain: a faint noise laid over everything */
body::after {
  content: "";
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 1000;
  opacity: .85;
  mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .37  0 0 0 0 .28  0 0 0 .2 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 3px; }
[hidden] { display: none !important; }

.label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-3);
  line-height: 1.4;
}
.num { font-variant-numeric: tabular-nums; }
.wrap {
  max-width: calc(var(--col) + var(--gutter) * 2);
  margin: 0 auto;
  padding: 0 var(--gutter);
}

/* ---------- Screens: each one scrolls on its own and runs under the bar ---------- */
.screen {
  position: fixed; inset: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  background: var(--paper);
  padding-bottom: var(--bar-space);
}
.top {
  padding-top: calc(var(--safe-t) + 6px);
}
.top .wrap { display: flex; align-items: center; justify-content: space-between; min-height: 52px; }
.home-btn {
  display: inline-flex; align-items: center; gap: 4px;
  min-height: 44px; margin-left: -6px; padding: 0 6px;
  color: var(--ink-2); font-size: 15px; font-weight: 500;
}
.screen-title {
  font-size: 34px; font-weight: 700; letter-spacing: -.022em; line-height: 1.1;
  margin: 6px 0 22px;
}

/* ---------- Home ---------- */
.home { display: flex; flex-direction: column; min-height: 100%; }
.home-top { display: flex; justify-content: space-between; align-items: baseline; padding-top: calc(var(--safe-t) + 22px); }
.home-center { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 24px 0 8px; }
.streak { text-align: center; }
.streak-n {
  display: block;
  font-size: 88px; font-weight: 700; letter-spacing: -.045em; line-height: 1;
}
.streak .label { display: block; margin-top: 10px; color: var(--ink-2); }
.streak-sub { margin: 10px auto 0; color: var(--ink-3); font-size: 14px; max-width: 22em; }
.cal { margin: 34px auto 0; width: 100%; max-width: 360px; border-top: 1.5px solid var(--ink); }
.cal-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 6px; }
.cal-title { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.cal-nav { display: flex; align-items: center; }
.cal-nav .icon-btn { width: 40px; height: 40px; }
.cal-today { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); min-height: 40px; padding: 0 8px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 2px; }
.cal-wd { text-align: center; font-size: 11px; font-weight: 600; color: var(--ink-3); letter-spacing: .06em; padding: 6px 0 8px; border-bottom: 1px solid var(--rule); margin-bottom: 6px; }
.day {
  position: relative;
  height: 42px;
  display: grid; place-items: center;
  font-size: 14px; font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.day i {
  position: absolute; width: 34px; height: 34px; border-radius: 50%;
  left: 50%; top: 50%; transform: translate(-50%, -50%);
}
.day span { position: relative; }
.day.future { color: var(--ink-3); }
.day.done i { background: var(--ink); }
.day.done span { color: var(--paper); font-weight: 600; }
.day.today i { box-shadow: 0 0 0 1.5px var(--ink); }
.day.today.done i { box-shadow: 0 0 0 1.5px var(--paper), 0 0 0 3px var(--ink); }
.day.today span { font-weight: 700; }

/* ---------- List ---------- */
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-top: 1.5px solid var(--ink);
  border-bottom: 1px solid var(--rule);
}
.stat {
  position: relative;
  text-align: left;
  padding: 12px 12px 12px 0;
  min-height: 74px;
  display: flex; flex-direction: column; justify-content: space-between;
}
.stat + .stat { padding-left: 14px; border-left: 1px solid var(--rule); }
.stat .n { font-size: 28px; font-weight: 600; letter-spacing: -.02em; line-height: 1; color: var(--ink-3); transition: color .15s; }
.stat .label { margin-top: 10px; }
.stat[aria-pressed="true"] .n, .stat[aria-pressed="true"] .label { color: var(--ink); }
.stat[aria-pressed="true"]::before { content: ""; position: absolute; left: 0; right: 0; top: -1.5px; height: 4px; background: var(--ink); }
.stat + .stat[aria-pressed="true"]::before { left: -1px; }

.search { position: sticky; top: 0; z-index: 5; background: var(--paper); padding: 16px 0 0; }
.search-row { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--ink); }
.search-row svg { flex: none; color: var(--ink-3); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; font-size: 16px; padding: 12px 0; outline: none; }
.search input::placeholder { color: var(--ink-3); }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; }
.clear-btn { width: 44px; height: 44px; margin-right: -12px; color: var(--ink-3); display: grid; place-items: center; }
.list-head { display: flex; justify-content: space-between; align-items: baseline; padding: 26px 0 10px; border-bottom: 1px solid var(--rule); }

.entries { list-style: none; margin: 0; padding: 0; }
.entry { border-bottom: 1px solid var(--rule); }
.entry-head { display: grid; grid-template-columns: 1fr 44px 44px; align-items: start; column-gap: 2px; }
.entry-main { display: grid; grid-template-columns: 34px 1fr; text-align: left; padding: 16px 0; min-height: 70px; }
.entry-no { font-size: 11px; color: var(--ink-3); padding-top: 7px; letter-spacing: .04em; }
.entry-word { font-size: 20px; font-weight: 600; letter-spacing: -.012em; line-height: 1.3; word-break: break-word; }
.entry-pos { font-size: 12px; font-weight: 500; letter-spacing: .02em; color: var(--ink-3); margin-left: 8px; white-space: nowrap; }
.entry-meaning { grid-column: 2; margin-top: 3px; color: var(--ink-2); font-size: 15px; line-height: 1.6; word-break: break-word; }
.entry-meaning.empty { color: var(--ink-3); }
.entry-head > .icon-btn { margin-top: 12px; }

.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; color: var(--ink-2); border-radius: 50%; }
.icon-btn:active { background: var(--paper-deep); }
.icon-btn.speaking { color: var(--ink); }
.icon-btn.speaking svg .wave { animation: pulse .9s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .2; } }

.mark {
  width: 20px; height: 20px; border-radius: 50%;
  border: 1.25px solid var(--ink-3);
  display: grid; place-items: center;
  color: var(--paper);
  transition: background .15s, border-color .15s;
}
.mark svg { opacity: 0; }
[aria-pressed="true"] > .mark, .mark.on { background: var(--ink); border-color: var(--ink); }
[aria-pressed="true"] > .mark svg, .mark.on svg { opacity: 1; }

.entry-body { padding: 0 0 22px 34px; }
.entry-field { padding: 14px 0 0; }
.entry-field + .entry-field { border-top: 1px dashed var(--rule); margin-top: 14px; }
.entry-field .label { display: block; margin-bottom: 6px; }
.example-row { display: grid; grid-template-columns: 1fr 44px; align-items: start; gap: 4px; }
/* example sentence: set off with a thin rule instead of italics (the sans has no true italic for Japanese) */
.example { font-size: 16px; line-height: 1.6; margin: 0; padding: 2px 0 2px 12px; border-left: 2px solid var(--rule); }
.example-row .icon-btn { margin-top: -8px; }
.note { margin: 0; color: var(--ink-2); white-space: pre-wrap; word-break: break-word; }
.entry-actions { display: flex; gap: 28px; margin-top: 18px; }
.text-btn {
  min-height: 44px;
  font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink);
  text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 5px;
}
.text-btn.danger { color: var(--danger); }
.text-btn:disabled { opacity: .35; cursor: default; }

.empty-state { padding: 56px 0 32px; }
.empty-state h2 { font-size: 22px; font-weight: 600; letter-spacing: -.01em; line-height: 1.35; margin: 0 0 8px; }
.empty-state p { margin: 0; color: var(--ink-2); max-width: 30em; }

.data { margin-top: 64px; border-top: 1.5px solid var(--ink); padding: 14px 0 0; }
.data p { color: var(--ink-2); margin: 10px 0 8px; max-width: 32em; font-size: 14px; }
.data-actions { display: flex; gap: 28px; }
.colophon { padding: 40px 0 12px; }
.sources { margin-top: 40px; padding-top: 12px; border-top: 1px solid var(--rule); }
.sources ul { list-style: none; margin: 8px 0 0; padding: 0; }
.sources li { font-size: 12px; line-height: 1.6; color: var(--ink-3); margin-bottom: 4px; }
.sources a, .src-line { color: var(--ink-3); }
.sources a { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.src-line { font-size: 11px; margin: 14px 0 0; letter-spacing: .02em; }
.status-actions { display: flex; flex-wrap: wrap; gap: 24px; margin-top: 2px; }

/* ---------- Buttons ---------- */
.btn {
  height: 52px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  border: 1px solid var(--ink);
  background: var(--paper);
  font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  transition: background .12s, color .12s;
}
.btn:active { background: var(--paper-deep); }
.btn.solid { background: var(--ink); color: var(--paper); }
.btn.solid:active { background: #3a3631; }
.btn:disabled { opacity: .35; cursor: default; }

/* ---------- Add ---------- */
.add { padding-top: 10px; }
.add-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; }
.add-row input {
  width: 100%; min-width: 0;
  border: 0; border-bottom: 1.5px solid var(--ink); border-radius: 0;
  background: transparent; outline: none;
  font-size: 26px; font-weight: 600; letter-spacing: -.015em;
  padding: 8px 0 10px;
}
.add-row input::placeholder { color: var(--ink-3); font-weight: 500; }
.add-row .btn { width: 92px; }
.nohit { margin-top: 30px; }
.nohit-t { font-size: 22px; font-weight: 700; letter-spacing: -.01em; margin: 30px 0 2px; }
.nohit .nohit-t { margin-top: 0; }
.muted { color: var(--ink-3); font-size: 14px; margin: 16px 0 0; }
.small-btn {
  min-height: 36px; padding: 0;
  font-size: 13px; font-weight: 600; color: var(--ink-2);
  text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px;
}
.manual { display: grid; gap: 8px; margin-top: 12px; }
.manual input { border: 0; border-bottom: 1px solid var(--ink); border-radius: 0; background: transparent; font-size: 16px; padding: 10px 0; outline: none; }
.manual input[name=pos] { border-bottom-color: var(--rule); }
.manual .btn { margin-top: 8px; }
.recent { list-style: none; margin: 30px 0 0; padding: 0; }
.recent-item { padding: 16px 0 18px; border-top: 1px solid var(--rule); }
.recent-item:first-child { border-top: 1.5px solid var(--ink); }
.recent-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.recent-word { font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; word-break: break-word; }
.recent-item.older .recent-word { font-size: 17px; font-weight: 600; }
.recent-sum { color: var(--ink-2); margin: 2px 0 0; font-size: 14px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.wstate { font-size: 13px; color: var(--ink-3); margin: 4px 0 0; }
.wstate.busy::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); margin-right: 8px; vertical-align: 1px; animation: pulse 1s ease-in-out infinite; }
.icon-btn.small { width: 36px; height: 36px; }

/* ---------- Entries: senses by part of speech ---------- */
.ents { margin-top: 10px; }
.ent + .ent { margin-top: 16px; }
.ent-pos { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 3px; }
.senses { margin: 0; padding: 0 0 0 1.7em; }
.senses li { font-size: 15px; line-height: 1.55; padding: 2px 0; word-break: break-word; }
.senses li::marker { color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }
.en-tag { display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: .08em; line-height: 1.5; border: 1px solid var(--rule); border-radius: 3px; color: var(--ink-3); padding: 0 4px; margin-right: 6px; vertical-align: 2px; }
.en-text { color: var(--ink-2); font-size: 14px; }
.more { min-height: 32px; padding: 0 0 0 1.7em; font-size: 12px; font-weight: 600; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; }
.ent-ex { display: grid; grid-template-columns: 1fr 36px; align-items: start; gap: 4px; margin-top: 6px; }
.ent-ex p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--ink-2); padding-left: 10px; border-left: 2px solid var(--rule); }
.note-fld { display: block; margin-top: 18px; }
.note-fld textarea { display: block; width: 100%; border: 0; border-bottom: 1px solid var(--rule); border-radius: 0; background: transparent; font-size: 16px; line-height: 1.5; padding: 6px 0; outline: none; resize: vertical; }
.note-fld textarea:focus { border-bottom-color: var(--ink); }
.voice { margin-top: 40px; padding-top: 12px; border-top: 1px solid var(--rule); }
.voice-row { display: flex; align-items: center; gap: 18px; margin-top: 8px; }
.voice select { flex: 1; min-width: 0; min-height: 40px; font: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 8px; background: transparent; color: var(--ink); }

/* ---------- Review: one big card ---------- */
#s-review { overflow: hidden; padding-bottom: 0; }
.rv {
  display: flex; flex-direction: column;
  height: calc(100vh - var(--safe-t) - 58px - var(--bar-h) - var(--bar-bottom) - 14px);
  height: calc(100dvh - var(--safe-t) - 58px - var(--bar-h) - var(--bar-bottom) - 14px);
}
.rv-stage { position: relative; flex: 1; min-height: 0; }
#rv-card-slot { position: absolute; inset: 0; }
.rv-card { position: absolute; inset: 0; border-radius: var(--rv-radius); cursor: pointer; -webkit-user-select: none; user-select: none; will-change: transform; }
.rv-face { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 20px 26px 22px; border-radius: inherit; overflow: hidden; }
.rv-front { background: #2b2a28; color: #fff; }
.rv-back { background: #fff; color: var(--ink); border: 1.5px solid #dcd7cc; }
.rv-top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; letter-spacing: .04em; min-height: 20px; }
.rv-front .rv-top { color: rgba(255, 255, 255, .5); }
.rv-back .rv-top { color: var(--ink-3); }
.rv-counts { display: flex; gap: 12px; }
.c-miss { color: #b3412e; } .c-got { color: #2e7d4f; }
.rv-front .c-miss { color: #e28f7d; } .rv-front .c-got { color: #8fcaa3; }
.rv-word-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 12px; }
.rv-word { font-size: clamp(34px, 11vw, 54px); font-weight: 600; letter-spacing: -.025em; line-height: 1.12; margin: 0; word-break: break-word; }
.rv-say { color: rgba(255, 255, 255, .72); margin: 12px 0 0 -8px; }
.rv-say:active { background: rgba(255, 255, 255, .1); }
.rv-hint { text-align: center; font-size: 13px; color: rgba(255, 255, 255, .45); margin: 0; }
.rv-back-word { font-size: 24px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; margin: 12px 0 2px; word-break: break-word; }
.rv-scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; margin: 0 -8px; padding: 0 8px 6px; }
.rv-judge { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding-top: 14px; }
.judge { height: 58px; border-radius: 29px; border: 1.5px solid var(--rule); background: #fff; display: grid; place-items: center; transition: transform .1s; }
.judge.miss { color: #b3412e; } .judge.got { color: #2e7d4f; }
.judge:active { transform: scale(.96); }
.rv-ov { position: absolute; z-index: 3; border-radius: var(--rv-radius); display: grid; place-items: center; pointer-events: none; opacity: 0; }
.rv-ov span { font-size: 40px; font-weight: 700; letter-spacing: -.02em; }
.rv-ov.got { background: #d6ecdd; border: 2px solid #9ccfad; color: #2e7d4f; }
.rv-ov.miss { background: #f7ddd6; border: 2px solid #e8a999; color: #b3412e; }
.rv-done { cursor: default; }
.rv-done .rv-face { background: #fff; border: 1.5px solid #dcd7cc; justify-content: center; align-items: center; text-align: center; }
.done-big { font-size: 64px; font-weight: 700; letter-spacing: -.04em; line-height: 1; margin: 0; }
.done-counts { display: flex; gap: 24px; justify-content: center; font-size: 20px; font-weight: 700; margin: 14px 0 0; }
.done-actions { display: grid; gap: 10px; width: 100%; max-width: 260px; margin-top: 32px; }

.sources a[href*="creativecommons"] { white-space: nowrap; }
/* ---------- Tab bar ---------- */
.tabbar {
  position: fixed; z-index: 30;
  left: var(--bar-side); right: var(--bar-side);
  bottom: var(--bar-bottom);
  max-width: 420px; margin: 0 auto;
  height: var(--bar-h);
  border-radius: 999px;
  display: grid; grid-template-columns: repeat(3, 1fr);
  padding: 0 4px;
}
.tb-glass {
  position: absolute; inset: 0; border-radius: inherit;
  background: rgba(24, 23, 21, var(--tb-tint));
  -webkit-backdrop-filter: blur(var(--tb-blur)) saturate(170%);
  backdrop-filter: blur(var(--tb-blur)) saturate(170%);
  border: 1px solid rgba(255, 255, 255, var(--tb-rim));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, calc(var(--tb-rim) * .7)), 0 10px 30px rgba(29, 27, 24, .16);
}
.tb-pill {
  position: absolute; left: 0; top: 4px; bottom: 4px;
  border-radius: 999px;
  background: rgba(255, 255, 255, var(--tb-pill));
  border: 1px solid transparent;
  opacity: 0;
  pointer-events: none;
  will-change: transform;
}
.tb-pill.lens {
  -webkit-backdrop-filter: brightness(1.28) saturate(1.3);
  backdrop-filter: brightness(1.28) saturate(1.3);
}
.tab {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: rgba(255, 255, 255, .74);
  transition: color .18s;
}
.tab.selected { color: #fff; }
.tab-icon { display: block; width: 26px; height: 26px; will-change: transform; }
.tab-icon svg { display: block; }
.tab-label { font-size: 10.5px; font-weight: 600; letter-spacing: .01em; line-height: 1.2; }

/* ---------- Dialog / toast ---------- */
.scrim {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(29, 27, 24, .28);
  display: flex; align-items: flex-end; justify-content: center;
  padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
  animation: fade .15s ease-out;
}
@keyframes fade { from { opacity: 0; } }
.dialog { width: 100%; max-width: 440px; background: var(--paper); border-top: 1.5px solid var(--ink); padding: 22px 22px 18px; }
.dialog h3 { font-size: 21px; font-weight: 700; letter-spacing: -.015em; line-height: 1.3; margin: 8px 0 8px; word-break: break-word; }
.dialog p { margin: 0; color: var(--ink-2); }
.dialog-actions { display: grid; gap: 10px; margin-top: 24px; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fbf7f2; }
.toast {
  position: fixed; left: 50%; z-index: 60;
  bottom: calc(var(--bar-bottom) + var(--bar-h) + 14px);
  transform: translateX(-50%);
  background: var(--ink); color: var(--paper);
  padding: 10px 16px; font-size: 14px;
  max-width: calc(100% - 48px);
  animation: fade .15s ease-out;
}

@media (min-width: 760px) {
  :root { --gutter: 48px; --bar-side: 24px; }
  .home-top { padding-top: 48px; }
  .card-word { font-size: 56px; }
  .scrim { align-items: center; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ================= Lookup queue ================= */
const Q = { chain: Promise.resolve(), lastStart: -Infinity, waiting: new Set(), active: null };
const gapMs = () => { const g = Number(window.Wordbook.lookupGapMs); return isFinite(g) && g >= 0 ? g : 8000; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
function queueLookup(id) {
  if (Q.waiting.has(id) || Q.active === id) return Q.chain;
  const w = byId(id);
  if (!w) return Q.chain;
  w.state = 'pending'; delete w.failKind; save();
  Q.waiting.add(id);
  refreshWordViews();
  const p = Q.chain.then(async () => {
    const wait = Q.lastStart + gapMs() - performance.now(); // performance.now: steady even if the wall clock jumps
    if (wait > 0) await sleep(wait);
    Q.waiting.delete(id);
    if (!byId(id)) return;
    Q.active = id; refreshWordViews();
    Q.lastStart = performance.now();
    try { await fetchInto(id); } finally { Q.active = null; refreshWordViews(); }
  });
  Q.chain = p.catch(() => {});
  return p;
}
// asks the dictionary and stores the result on the word
async function fetchInto(id) {
  const w = byId(id);
  if (!w) return;
  let res = null, kind = null;
  try { res = await window.Wordbook.lookupWord(w.word); }
  catch (e) { kind = (e && e.kind) || 'unavailable'; }
  if (!kind && (!res || typeof res !== 'object')) kind = 'unavailable';
  const cur = byId(id);
  if (!cur) return;
  if (kind === 'not_found' || kind === 'invalid_input') {
    // not a word the dictionary knows: it is not kept (the user can "Add anyway")
    words = words.filter(x => x.id !== id);
    save();
    noHit(cur.word, id);
    return;
  }
  if (kind) {
    cur.state = 'failed'; cur.failKind = kind === 'offline' || kind === 'rate_limit' ? kind : 'unavailable';
    save();
    return;
  }
  const entries = normEntries(res && res.entries);
  delete cur.state; delete cur.failKind;
  if (entries) cur.entries = entries; else delete cur.entries;
  cur.meaning = str(res.meaning) || (entries ? entries[0].senses.slice(0, 3).map(s => s.ja || s.en).join(' / ') : cur.meaning);
  cur.pos = str(res.pos) || (entries ? entries[0].pos : cur.pos);
  cur.example = str(res.example) || cur.example;
  const src = normSrc(res.source);
  if (src) cur.src = src; else delete cur.src;
  if (res.incomplete === true) cur.incomplete = true; else delete cur.incomplete;
  delete cur.manual;
  cur.updatedAt = Date.now();
  save();
}
function refreshWordViews() {
  if (current === 'add') renderRecent();
  if (current === 'list') { const y = $('#s-list').scrollTop; renderResults(); $('#s-list').scrollTop = y; }
}
// back online: fetch what could not be fetched (the queue keeps the spacing)
window.addEventListener('online', () => {
  words.filter(w => w.state === 'failed').slice(0, 10).forEach(w => queueLookup(w.id));
});

function stateLine(w) {

    return `<p class="wstate">Saved. Meaning not fetched (${why}).</p><button class="small-btn" data-act="retry" data-id="${esc(w.id)}">Retry</button>`;

function validWord(text) {

}
function addWord() {

  const dup = words.find(w => w.word.toLowerCase() === text.toLowerCase());
  if (dup) {
    addMsg = { kind: 'dup', word: text };
    recent = [dup.id, ...recent.filter(x => x !== dup.id)];
    input.value = '';
    renderAddMsg(); renderRecent();
    return;
  }
  if (!validWord(text)) { addMsg = { kind: 'invalid', word: text }; renderAddMsg(); return; }
  const now = Date.now();
  const w = normalize({ id: uid(), word: text, createdAt: now, updatedAt: now, state: 'pending' });
  words.push(w);
  save(); // saved at once, so nothing is lost if the lookup cannot run

function saveManual() {
  const f = $('#manual-form');
  if (!f || !addMsg) return;
  const meaning = f.meaning.value.trim();
  if (!meaning) { f.meaning.focus(); return; }
  const pos = f.pos.value.trim();
  const now = Date.now();
  const w = normalize({
    id: uid(), word: addMsg.word, meaning, pos, createdAt: now, updatedAt: now, manual: true,
    entries: [{ pos, senses: [{ ja: meaning }] }], src: { meaning: 'manual', ...(pos ? { pos: 'manual' } : {}) }
  });
  words.push(w); save();
  recent = [w.id, ...recent].slice(0, 6);
  addMsg = null; manualOpen = false;
  const input = $('#add-word'); if (input) input.value = '';
  renderAddMsg(); renderRecent();
}

/* ================= Review ================= */
const R = { deck: [], pos: 0, back: false, got: 0, miss: 0, missed: [], busy: false };

function startDeck(ids) { R.deck = shuffle(ids.slice()); R.pos = 0; R.back = false; R.got = 0; R.miss = 0; R.missed = []; }

  R.deck = R.deck.filter(id => byId(id));

}

        </div>
      </div>`;
  }
  renderCard();
}
function countsHTML() {
  return `<span class="rv-counts"><span class="c-miss">✗ ${R.miss}</span><span class="c-got">✓ ${R.got}</span></span>`;
}
function renderCard() {
  const slot = $('#rv-card-slot');
  if (!slot) return;
  while (R.pos < R.deck.length && !byId(R.deck[R.pos])) R.pos++;
  const total = R.deck.length;
  const judge = $('#rv-judge');
  if (!words.length) {
    slot.innerHTML = `<div class="rv-card rv-done"><div class="rv-face"><p class="done-big">No words yet.</p></div></div>`;
    judge.hidden = true; return;
  }
  if (R.pos >= total) {
    slot.innerHTML = `<div class="rv-card rv-done"><div class="rv-face">
      <p class="done-big num">${total}</p>
      <p class="done-counts"><span class="c-got">✓ ${R.got}</span><span class="c-miss">✗ ${R.miss}</span></p>
      <div class="done-actions">
        ${R.missed.length ? `<button class="btn solid" data-act="rv-again">Again</button>` : ''}
        <button class="btn" data-act="rv-done">Done</button>

    judge.hidden = true; return;
  }
  judge.hidden = false;
  const w = byId(R.deck[R.pos]);
  const top = `<div class="rv-top"><span class="rv-no num">${R.pos + 1} / ${total}</span>${countsHTML()}</div>`;
  slot.innerHTML = `<div class="rv-card ${R.back ? 'is-back' : ''}" id="rv-card" data-act="flip" role="button" aria-label="${R.back ? 'Show the word' : 'See answer'}">
    ${R.back
      ? `<div class="rv-face rv-back">${top}<p class="rv-back-word">${esc(w.word)}</p>
          <div class="rv-scroll">${entriesHTML(w, 'review') || '<p class="muted">No meaning yet.</p>'}</div></div>`
      : `<div class="rv-face rv-front">${top}
          <div class="rv-word-wrap"><p class="rv-word">${esc(w.word)}</p>${speakBtn(w.word, 'Pronounce ' + w.word, 'rv-say')}</div>

}
function flipCard() {

  if (reduced()) { R.back = toBack; renderCard(); return; }
  const total = rvVar('--rv-flip-ms', 200);
  R.busy = true;
  const out = card.animate([{ transform: 'scaleX(1)' }, { transform: 'scaleX(0)' }], { duration: total * 0.4, easing: 'cubic-bezier(.5,0,1,1)', fill: 'forwards' });
  out.onfinish = () => {
    R.back = toBack;
    renderCard();
    const c2 = $('#rv-card');
    const inn = c2.animate([{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: total * 0.6, easing: 'cubic-bezier(0,0,.2,1)' });
    inn.onfinish = inn.oncancel = () => { R.busy = false; };
  };
}
function judge(v) {
  if (R.pos >= R.deck.length) return;
  const w = byId(R.deck[R.pos]);
  if (!w) return;
  const got = v === 'got';
  if (w.learned !== got) { w.learned = got; w.updatedAt = Date.now(); save(); }
  if (got) R.got++; else { R.miss++; R.missed.push(w.id); }
  const stage = $('#rv-stage');
  const card = $('#rv-card');
  if (card) card.getAnimations().forEach(a => a.cancel()); // a flip in progress must not turn the next card
  // the stamp sits over the card; the next card is already underneath
  if (card && stage) {
    const r = card.getBoundingClientRect(), s = stage.getBoundingClientRect();
    const ov = document.createElement('div');
    ov.className = 'rv-ov ' + (got ? 'got' : 'miss');
    ov.style.cssText = `left:${r.left - s.left}px;top:${r.top - s.top}px;width:${r.width}px;height:${r.height}px`;
    ov.innerHTML = `<span>${got ? 'Got it' : 'Not yet'}</span>`;
    stage.appendChild(ov);
    const tilt = rvVar('--rv-tilt', 4) * (got ? 1 : -1), sc = rvVar('--rv-scale', 1.1);
    const tin = rvVar('--rv-in-ms', 100), hold = rvVar('--rv-hold-ms', 300), tout = rvVar('--rv-out-ms', 240);
    const drop = rvVar('--rv-drop', 90), outSc = rvVar('--rv-out-scale', 0.55);
    let anim;
    if (reduced()) {
      anim = ov.animate([{ opacity: 1 }, { opacity: 1, offset: 0.7 }, { opacity: 0 }], { duration: 450 });
    } else {
      const T = tin + hold + tout;
      anim = ov.animate([
        { offset: 0, opacity: 0, transform: 'rotate(0deg) scale(1)', easing: 'ease-out' },
        { offset: tin / T, opacity: 1, transform: `rotate(${tilt}deg) scale(${sc})` },
        { offset: (tin + hold) / T, opacity: 1, transform: `rotate(${tilt}deg) scale(${sc})`, easing: 'cubic-bezier(.55,0,1,.45)' },
        { offset: 1, opacity: 0, transform: `translate(${got ? 18 : -18}px, ${drop}px) rotate(${tilt}deg) scale(${outSc})` }
      ], { duration: T });
    }
    anim.onfinish = anim.oncancel = () => ov.remove();
  }
  R.pos++; R.back = false; R.busy = false;
  renderCard();
}

/* ================= Dialog ================= */
function dialog({ label, title, body, actions }) {
  clearToast();
  return new Promise(resolve => {
    const scrim = document.createElement('div');
    scrim.className = 'scrim';
    scrim.innerHTML = `<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t">
      ${label ? `<div class="label">${esc(label)}</div>` : ''}
      <h3 id="dlg-t">${esc(title)}</h3>
      ${body ? `<p>${esc(body)}</p>` : ''}
      <div class="dialog-actions">${actions.map((a, i) =>
        `<button class="btn ${a.style || ''}" data-i="${i}">${esc(a.text)}</button>`).join('')}</div>
    </div>`;
    const finish = v => { scrim.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') finish(null); };
    scrim.addEventListener('click', e => {
      if (e.target === scrim) return finish(null);
      const b = e.target.closest('[data-i]');
      if (b) finish(actions[+b.dataset.i].value);
    });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(scrim);
    const primary = scrim.querySelector('.btn.solid, .btn.danger');
    (primary || scrim.querySelector('.btn')).focus();
  });
}
/* ================= Home: streak + calendar ================= */
let calMonth = null; // { y, m } shown in the calendar

function renderHome() {
  const now = new Date();
  if (!calMonth) calMonth = { y: now.getFullYear(), m: now.getMonth() };
  const s = streak();
  const doneToday = days.has(dayKey(now));
  const sub = s === 0
    ? (days.size ? 'Flip a card in Review to start a new streak.' : 'Flip a card in Review to start a streak.')
    : (doneToday ? 'You reviewed today.' : 'Review a card today to keep it going.');

  const { y, m } = calMonth;
  const first = new Date(y, m, 1);
  const lead = first.getDay();
  const count = new Date(y, m + 1, 0).getDate();
  const todayKey = dayKey(now);
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const n = i - lead + 1;
    if (n < 1 || n > count) { cells.push('<div class="day" aria-hidden="true"></div>'); continue; }
    const d = new Date(y, m, n);
    const k = dayKey(d);
    const done = days.has(k), isToday = k === todayKey, future = d > now && !isToday;
    const cls = ['day', done && 'done', isToday && 'today', future && 'future'].filter(Boolean).join(' ');
    const aria = d.toLocaleDateString('en-US', { month: 'long', day: 'numeric' }) + (isToday ? ', today' : '') + (done ? ', reviewed' : '');
    cells.push(`<div class="${cls}" data-day="${k}" aria-label="${aria}"><i></i><span>${n}</span></div>`);
  }
  // drop a fully empty last row so short months don't leave a hole
  if (lead + count <= 35) cells.length = 35;
  const isThisMonth = y === now.getFullYear() && m === now.getMonth();
  const title = first.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  $('#s-home').innerHTML = `<div class="home wrap">
    <div class="home-top">
      <span class="label">Wordbook</span>
      <span class="label">${now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}</span>
    </div>
    <div class="home-center">
      <div class="streak">
        <span class="streak-n num" id="streak-n">${s}</span>
        <span class="label">Day streak</span>
        <p class="streak-sub">${sub}</p>
      </div>
      <div class="cal" role="group" aria-label="Review calendar">
        <div class="cal-head">
          <span class="cal-title" id="cal-title">${title}</span>
          <div class="cal-nav">
            ${isThisMonth ? '' : '<button class="cal-today" data-act="cal-today">Today</button>'}
            <button class="icon-btn" data-act="cal" data-d="-1" aria-label="Previous month">${ICON.prev}</button>
            <button class="icon-btn" data-act="cal" data-d="1" aria-label="Next month">${ICON.next}</button>
          </div>
        </div>
        <div class="cal-grid">
          ${['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(d => `<div class="cal-wd">${d}</div>`).join('')}
          ${cells.join('')}
        </div>
      </div>
    </div>
  </div>`;
}
/* ================= Tab bar: glass capsule with a lifting lens ================= */
const TABS = ['review', 'add', 'list'];
const pill = $('#pill');
const tabbar = $('#tabbar');
const INSET = 4; // gap between the pill and its tab cell
const tabEl = n => tabbar.querySelector(`.tab[data-tab="${n}"]`);
const pillX = n => tabEl(n).offsetLeft + INSET;
const FLAT_SHADOW = '0 0 0 1px rgba(0,0,0,0), inset 0 1px 1px rgba(255,255,255,0), inset 0 -3px 8px rgba(0,0,0,0), 0 6px 18px rgba(0,0,0,0)';
const LENS_SHADOW = '0 0 0 1px rgba(0,0,0,.38), inset 0 1px 1px rgba(255,255,255,.6), inset 0 -3px 8px rgba(0,0,0,.2), 0 6px 18px rgba(0,0,0,.22)';

function tbVars() {
  const cs = getComputedStyle(document.documentElement);
  const n = (k, d) => { const v = parseFloat(cs.getPropertyValue(k)); return isFinite(v) ? v : d; };
  return {
    blur: n('--tb-blur', 16), rim: n('--tb-rim', .24), pill: n('--tb-pill', .16),
    lensScale: n('--tb-lens-scale', 1.18), iconScale: n('--tb-icon-scale', 1.14),
    move: n('--tb-move-ms', 170), lift: n('--tb-lift-ms', 110), hold: n('--tb-hold-ms', 70), settle: n('--tb-settle-ms', 240)
  };
}
// Safari has had trouble with var() inside -webkit-backdrop-filter; write the literal value too
function applyGlass() {
  const v = tbVars();
  const g = tabbar.querySelector('.tb-glass');
  const f = `blur(${v.blur}px) saturate(170%)`;
  g.style.webkitBackdropFilter = f; g.style.backdropFilter = f;
}
function setSelected(name) {
  tabbar.querySelectorAll('.tab').forEach(t => {
    const on = t.dataset.tab === name;
    t.classList.toggle('selected', on);
    if (on) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
  });
}
function layoutPill() {
  const t = tabEl('review');
  pill.style.width = (t.offsetWidth - INSET * 2) + 'px';
  pill.getAnimations().forEach(a => a.cancel());
  tabbar.querySelectorAll('.tab-icon').forEach(i => i.getAnimations().forEach(a => a.cancel()));
  pill.classList.remove('lens');
  if (TABS.includes(current)) { pill.style.transform = `translateX(${pillX(current)}px)`; pill.style.opacity = '1'; }
  else pill.style.opacity = '0';
  setSelected(TABS.includes(current) ? current : null);
}
// run callbacks when an animation's clock passes given times (works when the animation is paused and seeked too)
function atTimes(anim, marks) {
  marks.sort((a, b) => a.t - b.t);
  const tick = () => {
    if (anim.playState === 'idle') return;
    const ct = anim.currentTime || 0;
    while (marks.length && ct >= marks[0].t) marks.shift().fn();
    if (marks.length) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function moveLens(from, to) {
  const fromTab = TABS.includes(from) ? from : null;
  const toTab = TABS.includes(to) ? to : null;
  // start from wherever the pill is right now (a switch can interrupt another)
  const m = new DOMMatrixReadOnly(getComputedStyle(pill).transform === 'none' ? undefined : getComputedStyle(pill).transform);
  const curX = m.m41, curOpacity = parseFloat(getComputedStyle(pill).opacity);
  pill.getAnimations().forEach(a => a.cancel());
  tabbar.querySelectorAll('.tab-icon').forEach(i => i.getAnimations().forEach(a => a.cancel()));
  pill.classList.remove('lens');

  if (!toTab) { // back to Home: the pill simply fades away
    setSelected(null);
    pill.style.transform = `translateX(${curX}px)`;
    const a = pill.animate([{ opacity: curOpacity }, { opacity: 0 }], { duration: reduced() ? 1 : 180, easing: 'ease-out' });
    pill.style.opacity = '0';
    return a;
  }
  const x1 = pillX(toTab);
  if (reduced()) {
    setSelected(toTab);
    pill.style.transform = `translateX(${x1}px)`; pill.style.opacity = '1';
    return null;
  }
  const v = tbVars();
  const x0 = (fromTab || curOpacity > 0.01) ? curX : x1;
  const startOpacity = fromTab ? Math.max(curOpacity, 0) : 0;
  const S = v.lensScale;
  const tMoveStart = v.lift * 0.5;             // the lens starts travelling while it is still lifting
  const tArrive = tMoveStart + v.move;
  const tHoldEnd = tArrive + v.hold;
  const T = tHoldEnd + v.settle;
  const flat = { backgroundColor: `rgba(255,255,255,${v.pill})`, borderColor: 'rgba(255,255,255,0)', boxShadow: FLAT_SHADOW };
  const lens = { backgroundColor: 'rgba(255,255,255,0.07)', borderColor: `rgba(255,255,255,${Math.min(1, v.rim * 2.4)})`, boxShadow: LENS_SHADOW };
  const tf = (x, s) => `translateX(${x}px) scale(${s})`;
  const anim = pill.animate([
    { offset: 0, transform: tf(x0, 1), opacity: startOpacity, ...flat, easing: 'cubic-bezier(.3,.7,.4,1)' },
    { offset: tMoveStart / T, transform: tf(x0, 1 + (S - 1) * 0.75), opacity: 1, ...lens, easing: 'cubic-bezier(.2,.85,.25,1)' },
    { offset: tArrive / T, transform: tf(x1, S), opacity: 1, ...lens, easing: 'linear' },
    { offset: tHoldEnd / T, transform: tf(x1, S), opacity: 1, ...lens, easing: 'cubic-bezier(.4,0,.2,1)' },
    { offset: 1, transform: tf(x1, 1), opacity: 1, ...flat }
  ], { duration: T });
  pill.style.transform = tf(x1, 1); pill.style.opacity = '1';
  pill.classList.add('lens');

  const Si = v.iconScale;
  const toIcon = tabEl(toTab).querySelector('.tab-icon');
  toIcon.animate([
    { offset: 0, transform: 'scale(1)' },
    { offset: (tMoveStart + v.move * 0.45) / T, transform: 'scale(1)', easing: 'cubic-bezier(.2,.8,.3,1)' },
    { offset: tArrive / T, transform: `scale(${Si})` },
    { offset: tHoldEnd / T, transform: `scale(${Si})`, easing: 'cubic-bezier(.4,0,.2,1)' },
    { offset: 1, transform: 'scale(1)' }
  ], { duration: T });
  if (fromTab && fromTab !== toTab) {
    tabEl(fromTab).querySelector('.tab-icon').animate([
      { offset: 0, transform: 'scale(1)', easing: 'cubic-bezier(.2,.8,.3,1)' },
      { offset: tMoveStart / T, transform: `scale(${Si})`, easing: 'ease-in' },
      { offset: (tMoveStart + v.move * 0.5) / T, transform: 'scale(1)' },
      { offset: 1, transform: 'scale(1)' }
    ], { duration: T });
  }
  atTimes(anim, [
    { t: tMoveStart + v.move * 0.55, fn: () => setSelected(toTab) },
    { t: tHoldEnd + v.settle * 0.5, fn: () => pill.classList.remove('lens') }
  ]);
  anim.onfinish = () => pill.classList.remove('lens');
  return anim;
}
/* ================= Screens ================= */
let current = 'home';
const screenEl = n => $('#s-' + n);
function renderScreen(n) {
  if (n === 'home') renderHome();
  else if (n === 'review') { enterReview(); renderReview(); }
  else if (n === 'add') renderAdd();
  else if (n === 'list') renderList();
}
function crossfade(a, b) {
  const d = reduced() ? 1 : 260;
  a.getAnimations().forEach(x => x.cancel());
  b.getAnimations().forEach(x => x.cancel());
  b.hidden = false;
  b.style.zIndex = '2'; a.style.zIndex = '1';
  b.animate([{ opacity: 0 }, { opacity: 1 }], { duration: d, easing: 'ease-out' });
  const out = a.animate([{ opacity: 1 }, { opacity: 0 }], { duration: d * 0.85, easing: 'ease-in', fill: 'forwards' });
  out.onfinish = () => {
    if (current !== a.dataset.screen) a.hidden = true;
    out.cancel();
    a.style.zIndex = ''; b.style.zIndex = '';
  };
}
function go(name) {
  if (name === current) {
    const el = screenEl(name);
    if (el.scrollTop > 0) el.scrollTo({ top: 0, behavior: reduced() ? 'auto' : 'smooth' });
    return;
  }
  clearToast();
  const from = current;
  current = name;
  renderScreen(name);
  crossfade(screenEl(from), screenEl(name));
  moveLens(from, name);
  if (name === 'add' && !words.length) setTimeout(() => { const i = $('#add-word'); if (i) i.focus(); }, 300);
}
function rerenderCurrent() {
  renderScreen(current);
}

/* ================= Actions ================= */
async function confirmDelete(id) {
  const w = byId(id);
  if (!w) return;
  const ok = await dialog({
    label: 'Delete', title: `Delete “${w.word}”?`,
    body: 'This removes the word and its notes from this device. It cannot be undone.',
    actions: [{ text: 'Delete', style: 'danger', value: true }, { text: 'Cancel', value: false }]
  });
  if (!ok) return;
  words = words.filter(x => x.id !== id);
  open.delete(id);
  save();
  rerenderCurrent();
  toast(`Deleted “${w.word}”.`);
}
function exportJSON() {
  const payload = { app: 'wordbook', version: 1, exportedAt: new Date().toISOString(), count: words.length, words, days: [...days].sort() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `wordbook-${dayKey(new Date())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast(`Exported ${plural(words.length, 'word', 'words')}.`);
}
async function importFile(file) {
  let data;
  try { data = JSON.parse(await file.text()); }
  catch (e) { return dialog({ label: 'Import', title: 'This file could not be read.', body: 'Choose a JSON file exported from Wordbook.', actions: [{ text: 'OK', style: 'solid', value: null }] }); }
  const list = Array.isArray(data) ? data : (data && Array.isArray(data.words) ? data.words : null);
  const incoming = (list || []).map(x => { try { return normalize(x); } catch (e) { return null; } }).filter(Boolean);
  incoming.forEach(w => { if (w.state === 'pending') w.state = 'failed'; });
  if (!incoming.length) return dialog({ label: 'Import', title: 'No words found in this file.', body: 'Choose a JSON file exported from Wordbook.', actions: [{ text: 'OK', style: 'solid', value: null }] });
  let mode = 'replace';
  if (words.length) {
    mode = await dialog({
      label: 'Import', title: `Import ${plural(incoming.length, 'word', 'words')}?`,
      body: `Merge keeps the ${plural(words.length, 'word', 'words')} on this device and adds or updates from the file. Replace discards them and uses the file only.`,
      actions: [{ text: 'Merge', style: 'solid', value: 'merge' }, { text: 'Replace', value: 'replace' }, { text: 'Cancel', value: null }]
    });
    if (!mode) return;
  }
  if (mode === 'merge') { const map = new Map(words.map(w => [w.id, w])); incoming.forEach(w => map.set(w.id, w)); words = [...map.values()]; }
  else words = incoming;
  if (data && Array.isArray(data.days)) { data.days.forEach(d => { if (typeof d === 'string' && DAY_RE.test(d)) days.add(d); }); saveDays(); }
  open.clear();
  save();
  rerenderCurrent();
  toast(`Imported ${plural(incoming.length, 'word', 'words')}.`);
}

let noteTimer = null;
document.addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (tab) { go(tab.dataset.tab); return; }
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  const li = b.closest('.entry');
  const id = li ? li.dataset.id : null;
  switch (act) {
    case 'home': go('home'); break;
    case 'speak': Speech.speak(b.dataset.text, b); break;
    case 'cal': calMonth = (() => { const d = new Date(calMonth.y, calMonth.m + Number(b.dataset.d), 1); return { y: d.getFullYear(), m: d.getMonth() }; })(); renderHome(); break;
    case 'cal-today': calMonth = null; renderHome(); break;
    case 'filter': filter = b.dataset.f; renderList(); break;
    case 'clear': { query = ''; renderList(); const q = $('#q'); if (q) q.focus(); break; }
    case 'toggle': open.has(id) ? open.delete(id) : open.add(id); renderResults(); break;
    case 'learn': { const w = byId(id); w.learned = !w.learned; w.updatedAt = Date.now(); save(); renderList(); break; }
    case 'delete': confirmDelete(id); break;
    case 'more': {
      moreOpen.add(b.dataset.k);
      if (current === 'review') renderCard(); else if (current === 'add') renderRecent(); else renderResults();
      break;
    }
    case 'retry': queueLookup(b.dataset.id); break;
    case 'add-anyway': manualOpen = true; renderAddMsg(); break;
    case 'voice-test': Speech.speak('This is the voice for your wordbook.', b); break;
    case 'flip': flipCard(); break;
    case 'judge': judge(b.dataset.v); break;
    case 'rv-again': { startDeck(R.missed); renderCard(); break; }
    case 'rv-done': R.deck = []; go('home'); break;
    case 'export': exportJSON(); break;
    case 'import': $('#file').value = ''; $('#file').click(); break;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { query = e.target.value; renderResults(); return; }
  if (e.target.dataset && e.target.dataset.note) {
    const w = byId(e.target.dataset.note);
    if (!w) return;
    w.note = e.target.value.trim(); w.updatedAt = Date.now();
    clearTimeout(noteTimer); noteTimer = setTimeout(save, 300);
  }
});
document.addEventListener('focusout', e => { if (e.target.dataset && e.target.dataset.note) { clearTimeout(noteTimer); save(); } });
document.addEventListener('change', e => {
  if (e.target.id === 'voice-sel') Speech.choose(e.target.value);
});
$('#file').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) importFile(f); });
document.addEventListener('keydown', e => {
  if (current !== 'review' || $('.scrim') || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === ' ' || e.key === 'Enter') { if ($('#rv-card')) { e.preventDefault(); flipCard(); } }
  if (e.key === 'ArrowLeft') { e.preventDefault(); judge('miss'); }
  if (e.key === 'ArrowRight') { e.preventDefault(); judge('got'); }
});
window.addEventListener('storage', e => {
  if (e.key === KEY) words = load();
  if (e.key === DAYS_KEY) days = loadDays();
  if (e.key === KEY || e.key === DAYS_KEY) rerenderCurrent();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && current === 'home') renderHome(); });
window.addEventListener('resize', layoutPill);

try { history.replaceState({}, ''); } catch (e) {}
words = load();
days = loadDays();
Speech.init();
applyGlass();
renderHome();
layoutPill();

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
