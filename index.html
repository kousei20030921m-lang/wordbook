<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wordbook</title>
<meta name="description" content="A personal English wordbook.">
<meta name="theme-color" content="#f4f1ea">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wordbook">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root {
  --paper: #f4f1ea;
  --paper-deep: #ebe6da;
  --ink: #1d1b18;
  --ink-2: #57524a;
  --ink-3: #8c8578;
  --rule: #d6d0c3;
  --danger: #9b3a26;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", Meiryo, system-ui, sans-serif;
  --gutter: 24px;
  --col: 600px;
  --safe-t: env(safe-area-inset-top, 0px);

  /* ---- tab bar: the five knobs tuned in tabbar-lab.html ---- */
  --tb-blur: 16px;          /* how much the content behind the bar smears */
  --tb-tint: 0.8;           /* darkness of the glass (0 = clear, 1 = solid) */
  --tb-move-ms: 170;        /* travel time of the lens between tabs */
  --tb-lens-scale: 1.18;    /* how much the pill swells when it lifts into a lens */
  --tb-rim: 0.24;           /* brightness of the thin light edge */
  /* secondary knobs */
  --tb-icon-scale: 1.14;
  --tb-pill: 0.16;
  --tb-lift-ms: 110;
  --tb-hold-ms: 70;
  --tb-settle-ms: 240;

  /* 60pt tall, 22pt above the bottom edge (reference video 90px/33px at 1.5x) */
  --bar-h: 60px;
  --bar-bottom: max(22px, calc(env(safe-area-inset-bottom, 0px) - 12px));
  --bar-side: 5.6vw;
  --bar-space: calc(var(--bar-h) + var(--bar-bottom) + 28px);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  font-feature-settings: "palt" 0;
}
/* paper grain: a faint noise laid over everything */
body::after {
  content: "";
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 1000;
  opacity: .85;
  mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .37  0 0 0 0 .28  0 0 0 .2 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 3px; }
[hidden] { display: none !important; }

.label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-3);
  line-height: 1.4;
}
.num { font-variant-numeric: tabular-nums; }
.wrap {
  max-width: calc(var(--col) + var(--gutter) * 2);
  margin: 0 auto;
  padding: 0 var(--gutter);
}

/* ---------- Screens: each one scrolls on its own and runs under the bar ---------- */
.screen {
  position: fixed; inset: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  background: var(--paper);
  padding-bottom: var(--bar-space);
}
.top {
  padding-top: calc(var(--safe-t) + 6px);
}
.top .wrap { display: flex; align-items: center; justify-content: space-between; min-height: 52px; }
.home-btn {
  display: inline-flex; align-items: center; gap: 4px;
  min-height: 44px; margin-left: -6px; padding: 0 6px;
  color: var(--ink-2); font-size: 15px; font-weight: 500;
}
.screen-title {
  font-size: 34px; font-weight: 700; letter-spacing: -.022em; line-height: 1.1;
  margin: 6px 0 22px;
}

/* ---------- Home ---------- */
.home { display: flex; flex-direction: column; min-height: 100%; }
.home-top { display: flex; justify-content: space-between; align-items: baseline; padding-top: calc(var(--safe-t) + 22px); }
.home-center { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 24px 0 8px; }
.streak { text-align: center; }
.streak-n {
  display: block;
  font-size: 88px; font-weight: 700; letter-spacing: -.045em; line-height: 1;
}
.streak .label { display: block; margin-top: 10px; color: var(--ink-2); }
.streak-sub { margin: 10px auto 0; color: var(--ink-3); font-size: 14px; max-width: 22em; }
.cal { margin: 34px auto 0; width: 100%; max-width: 360px; border-top: 1.5px solid var(--ink); }
.cal-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 6px; }
.cal-title { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.cal-nav { display: flex; align-items: center; }
.cal-nav .icon-btn { width: 40px; height: 40px; }
.cal-today { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); min-height: 40px; padding: 0 8px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 2px; }
.cal-wd { text-align: center; font-size: 11px; font-weight: 600; color: var(--ink-3); letter-spacing: .06em; padding: 6px 0 8px; border-bottom: 1px solid var(--rule); margin-bottom: 6px; }
.day {
  position: relative;
  height: 42px;
  display: grid; place-items: center;
  font-size: 14px; font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.day i {
  position: absolute; width: 34px; height: 34px; border-radius: 50%;
  left: 50%; top: 50%; transform: translate(-50%, -50%);
}
.day span { position: relative; }
.day.future { color: var(--ink-3); }
.day.done i { background: var(--ink); }
.day.done span { color: var(--paper); font-weight: 600; }
.day.today i { box-shadow: 0 0 0 1.5px var(--ink); }
.day.today.done i { box-shadow: 0 0 0 1.5px var(--paper), 0 0 0 3px var(--ink); }
.day.today span { font-weight: 700; }

/* ---------- List ---------- */
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-top: 1.5px solid var(--ink);
  border-bottom: 1px solid var(--rule);
}
.stat {
  position: relative;
  text-align: left;
  padding: 12px 12px 12px 0;
  min-height: 74px;
  display: flex; flex-direction: column; justify-content: space-between;
}
.stat + .stat { padding-left: 14px; border-left: 1px solid var(--rule); }
.stat .n { font-size: 28px; font-weight: 600; letter-spacing: -.02em; line-height: 1; color: var(--ink-3); transition: color .15s; }
.stat .label { margin-top: 10px; }
.stat[aria-pressed="true"] .n, .stat[aria-pressed="true"] .label { color: var(--ink); }
.stat[aria-pressed="true"]::before { content: ""; position: absolute; left: 0; right: 0; top: -1.5px; height: 4px; background: var(--ink); }
.stat + .stat[aria-pressed="true"]::before { left: -1px; }

.search { position: sticky; top: 0; z-index: 5; background: var(--paper); padding: 16px 0 0; }
.search-row { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--ink); }
.search-row svg { flex: none; color: var(--ink-3); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; font-size: 16px; padding: 12px 0; outline: none; }
.search input::placeholder { color: var(--ink-3); }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; }
.clear-btn { width: 44px; height: 44px; margin-right: -12px; color: var(--ink-3); display: grid; place-items: center; }
.list-head { display: flex; justify-content: space-between; align-items: baseline; padding: 26px 0 10px; border-bottom: 1px solid var(--rule); }

.entries { list-style: none; margin: 0; padding: 0; }
.entry { border-bottom: 1px solid var(--rule); }
.entry-head { display: grid; grid-template-columns: 1fr 44px 44px; align-items: start; column-gap: 2px; }
.entry-main { display: grid; grid-template-columns: 34px 1fr; text-align: left; padding: 16px 0; min-height: 70px; }
.entry-no { font-size: 11px; color: var(--ink-3); padding-top: 7px; letter-spacing: .04em; }
.entry-word { font-size: 20px; font-weight: 600; letter-spacing: -.012em; line-height: 1.3; word-break: break-word; }
.entry-pos { font-size: 12px; font-weight: 500; letter-spacing: .02em; color: var(--ink-3); margin-left: 8px; white-space: nowrap; }
.entry-meaning { grid-column: 2; margin-top: 3px; color: var(--ink-2); font-size: 15px; line-height: 1.6; word-break: break-word; }
.entry-meaning.empty { color: var(--ink-3); }
.entry-head > .icon-btn { margin-top: 12px; }

.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; color: var(--ink-2); border-radius: 50%; }
.icon-btn:active { background: var(--paper-deep); }
.icon-btn.speaking { color: var(--ink); }
.icon-btn.speaking svg .wave { animation: pulse .9s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .2; } }

.mark {
  width: 20px; height: 20px; border-radius: 50%;
  border: 1.25px solid var(--ink-3);
  display: grid; place-items: center;
  color: var(--paper);
  transition: background .15s, border-color .15s;
}
.mark svg { opacity: 0; }
[aria-pressed="true"] > .mark, .mark.on { background: var(--ink); border-color: var(--ink); }
[aria-pressed="true"] > .mark svg, .mark.on svg { opacity: 1; }

.entry-body { padding: 0 0 22px 34px; }
.entry-field { padding: 14px 0 0; }
.entry-field + .entry-field { border-top: 1px dashed var(--rule); margin-top: 14px; }
.entry-field .label { display: block; margin-bottom: 6px; }
.example-row { display: grid; grid-template-columns: 1fr 44px; align-items: start; gap: 4px; }
/* example sentence: set off with a thin rule instead of italics (the sans has no true italic for Japanese) */
.example { font-size: 16px; line-height: 1.6; margin: 0; padding: 2px 0 2px 12px; border-left: 2px solid var(--rule); }
.example-row .icon-btn { margin-top: -8px; }
.note { margin: 0; color: var(--ink-2); white-space: pre-wrap; word-break: break-word; }
.entry-actions { display: flex; gap: 28px; margin-top: 18px; }
.text-btn {
  min-height: 44px;
  font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink);
  text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 5px;
}
.text-btn.danger { color: var(--danger); }
.text-btn:disabled { opacity: .35; cursor: default; }

.empty-state { padding: 56px 0 32px; }
.empty-state h2 { font-size: 22px; font-weight: 600; letter-spacing: -.01em; line-height: 1.35; margin: 0 0 8px; }
.empty-state p { margin: 0; color: var(--ink-2); max-width: 30em; }

.data { margin-top: 64px; border-top: 1.5px solid var(--ink); padding: 14px 0 0; }
.data p { color: var(--ink-2); margin: 10px 0 8px; max-width: 32em; font-size: 14px; }
.data-actions { display: flex; gap: 28px; }
.colophon { padding: 40px 0 12px; }
.sources { margin-top: 40px; padding-top: 12px; border-top: 1px solid var(--rule); }
.sources ul { list-style: none; margin: 8px 0 0; padding: 0; }
.sources li { font-size: 12px; line-height: 1.6; color: var(--ink-3); margin-bottom: 4px; }
.sources a, .src-line { color: var(--ink-3); }
.sources a { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.src-line { font-size: 11px; margin: 14px 0 0; letter-spacing: .02em; }
.status-actions { display: flex; flex-wrap: wrap; gap: 24px; margin-top: 2px; }

/* ---------- Buttons ---------- */
.btn {
  height: 52px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  border: 1px solid var(--ink);
  background: var(--paper);
  font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  transition: background .12s, color .12s;
}
.btn:active { background: var(--paper-deep); }
.btn.solid { background: var(--ink); color: var(--paper); }
.btn.solid:active { background: #3a3631; }
.btn:disabled { opacity: .35; cursor: default; }

/* ---------- Add ---------- */
.add-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; }
.add-row input {
  width: 100%; min-width: 0;
  border: 0; border-bottom: 1.5px solid var(--ink); border-radius: 0;
  background: transparent; outline: none;
  font-size: 26px; font-weight: 600; letter-spacing: -.015em;
  padding: 8px 0 10px;
}
.add-row input::placeholder { color: var(--ink-3); font-weight: 500; font-size: 22px; letter-spacing: -.005em; }
.add-row .btn { width: 92px; }
.hint { color: var(--ink-3); font-size: 13px; margin: 12px 0 0; }
.add-err { color: var(--danger); font-size: 13px; margin: 8px 0 0; }
.added { margin-top: 40px; border-top: 1.5px solid var(--ink); padding-top: 12px; }
.added-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.status { font-size: 13px; color: var(--ink-2); margin: 8px 0 0; }
.status.busy::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); margin-right: 8px; animation: pulse 1s ease-in-out infinite; }

/* ---------- Forms (shared by Add details and Edit) ---------- */
.fld { display: block; padding: 20px 0 0; }
.fld .label { display: flex; justify-content: space-between; }
.fld input[type=text], .fld textarea {
  display: block; width: 100%;
  border: 0; border-bottom: 1px solid var(--rule);
  background: transparent;
  padding: 9px 0 10px;
  font-size: 16px; line-height: 1.55;
  border-radius: 0; outline: none; resize: none;
  transition: border-color .15s;
}
.fld input[type=text]:focus, .fld textarea:focus { border-bottom-color: var(--ink); }
.fld input.big { font-size: 24px; font-weight: 600; letter-spacing: -.015em; line-height: 1.3; }
.fld.invalid input { border-bottom-color: var(--danger); }
.err { color: var(--danger); font-size: 13px; margin-top: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip {
  min-height: 36px; padding: 0 14px;
  border: 1px solid var(--rule); border-radius: 18px;
  font-size: 14px; font-weight: 500; color: var(--ink-2);
}
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.toggle-row {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; min-height: 60px; margin-top: 26px;
  border-top: 1.5px solid var(--ink); border-bottom: 1px solid var(--rule);
  font-size: 16px; text-align: left;
}
.toggle-row .mark { width: 24px; height: 24px; }
.form-delete { margin-top: 36px; }

/* full-screen overlay (Edit) sits above the tab bar */
.view {
  position: fixed; inset: 0; z-index: 40;
  background: var(--paper);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  animation: rise .18s ease-out;
}
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
.view-top { position: sticky; top: 0; z-index: 2; background: var(--paper); padding-top: var(--safe-t); border-bottom: 1px solid var(--rule); }
.view-top .wrap { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 56px; }
.view-top .label { text-align: center; color: var(--ink); padding-left: .12em; }
.top-btn { min-height: 44px; padding: 0 2px; font-size: 15px; color: var(--ink-2); justify-self: start; }
.top-btn.right { justify-self: end; color: var(--ink); font-weight: 600; }
.form { padding-top: 8px; padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px)); }

/* ---------- Review ---------- */
.scope { display: flex; gap: 24px; }
.scope .text-btn { color: var(--ink-3); text-decoration-color: transparent; }
.scope .text-btn[aria-pressed="true"] { color: var(--ink); text-decoration-color: var(--ink); }
.progress { height: 1px; background: var(--rule); margin-top: 4px; position: relative; }
.progress i { position: absolute; left: 0; top: -1px; height: 3px; background: var(--ink); transition: width .25s ease; }
.card { padding-top: 40px; padding-bottom: calc(52px + 24px); }
.card-no { display: flex; justify-content: space-between; }
.card-word { font-size: 44px; font-weight: 700; line-height: 1.1; letter-spacing: -.028em; margin: 16px 0 8px; word-break: break-word; }
.card-pos { color: var(--ink-3); font-size: 15px; font-weight: 500; min-height: 1em; }
.card-say { margin: 18px 0 0; }
.card-say .icon-btn { width: 52px; height: 52px; border: 1px solid var(--rule); }
.card-reveal { margin-top: 28px; border-top: 1px solid var(--rule); padding-top: 20px; }
.card-meaning { font-size: 20px; font-weight: 500; line-height: 1.55; margin: 0; word-break: break-word; }
/* several dictionary senses ("a / b / c") are set one per line */
.card-senses { list-style: none; margin: 0; padding: 0; }
.card-senses li { font-size: 18px; font-weight: 500; line-height: 1.5; padding: 6px 0; word-break: break-word; }
.card-senses li + li { border-top: 1px dashed var(--rule); }
.sources a[href*="creativecommons"] { white-space: nowrap; }
.card-example { margin-top: 22px; }
.card-example .label { margin-bottom: 6px; }
.card-hint { color: var(--ink-3); font-size: 15px; margin: 0; }
.review-actions {
  position: fixed; left: 0; right: 0; z-index: 6;
  bottom: calc(var(--bar-bottom) + var(--bar-h) + 14px);
}
.review-actions .btn { width: 100%; }
.grade { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grade .mark { width: 16px; height: 16px; }
.grade .btn:not(.solid) .mark { border-color: var(--ink-3); }
.grade .btn.solid .mark.on { background: var(--paper); border-color: var(--paper); color: var(--ink); }
.done h2 { font-size: 32px; font-weight: 700; letter-spacing: -.025em; line-height: 1.15; margin: 14px 0 10px; }
.done p { color: var(--ink-2); margin: 0; }
.done-actions { display: grid; gap: 12px; margin-top: 28px; }

/* ---------- Tab bar ---------- */
.tabbar {
  position: fixed; z-index: 30;
  left: var(--bar-side); right: var(--bar-side);
  bottom: var(--bar-bottom);
  max-width: 420px; margin: 0 auto;
  height: var(--bar-h);
  border-radius: 999px;
  display: grid; grid-template-columns: repeat(3, 1fr);
  padding: 0 4px;
}
.tb-glass {
  position: absolute; inset: 0; border-radius: inherit;
  background: rgba(24, 23, 21, var(--tb-tint));
  -webkit-backdrop-filter: blur(var(--tb-blur)) saturate(170%);
  backdrop-filter: blur(var(--tb-blur)) saturate(170%);
  border: 1px solid rgba(255, 255, 255, var(--tb-rim));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, calc(var(--tb-rim) * .7)), 0 10px 30px rgba(29, 27, 24, .16);
}
.tb-pill {
  position: absolute; left: 0; top: 4px; bottom: 4px;
  border-radius: 999px;
  background: rgba(255, 255, 255, var(--tb-pill));
  border: 1px solid transparent;
  opacity: 0;
  pointer-events: none;
  will-change: transform;
}
.tb-pill.lens {
  -webkit-backdrop-filter: brightness(1.28) saturate(1.3);
  backdrop-filter: brightness(1.28) saturate(1.3);
}
.tab {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: rgba(255, 255, 255, .74);
  transition: color .18s;
}
.tab.selected { color: #fff; }
.tab-icon { display: block; width: 26px; height: 26px; will-change: transform; }
.tab-icon svg { display: block; }
.tab-label { font-size: 10.5px; font-weight: 600; letter-spacing: .01em; line-height: 1.2; }

/* ---------- Dialog / toast ---------- */
.scrim {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(29, 27, 24, .28);
  display: flex; align-items: flex-end; justify-content: center;
  padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
  animation: fade .15s ease-out;
}
@keyframes fade { from { opacity: 0; } }
.dialog { width: 100%; max-width: 440px; background: var(--paper); border-top: 1.5px solid var(--ink); padding: 22px 22px 18px; }
.dialog h3 { font-size: 21px; font-weight: 700; letter-spacing: -.015em; line-height: 1.3; margin: 8px 0 8px; word-break: break-word; }
.dialog p { margin: 0; color: var(--ink-2); }
.dialog-actions { display: grid; gap: 10px; margin-top: 24px; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fbf7f2; }
.toast {
  position: fixed; left: 50%; z-index: 60;
  bottom: calc(var(--bar-bottom) + var(--bar-h) + 14px);
  transform: translateX(-50%);
  background: var(--ink); color: var(--paper);
  padding: 10px 16px; font-size: 14px;
  max-width: calc(100% - 48px);
  animation: fade .15s ease-out;
}

@media (min-width: 760px) {
  :root { --gutter: 48px; --bar-side: 24px; }
  .home-top { padding-top: 48px; }
  .card-word { font-size: 56px; }
  .scrim { align-items: center; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<main id="screens">
  <section class="screen" id="s-home" data-screen="home" aria-label="Home"></section>
  <section class="screen" id="s-review" data-screen="review" aria-label="Review" hidden></section>

let addedStatus = '';
let addedBusy = false;
let addedRetry = false;   // offer "Try again" (offline / busy / unreachable)
let addedLemma = null;    // base form the dictionary answered with (ran -> run)
let saveTimer = null;

function renderAdd() {
  const el = $('#s-add');
  if (!$('#add-form', el)) {
    el.innerHTML = `${topBar()}
    <div class="wrap">
      <h1 class="screen-title">Add</h1>
      <form class="add-row" id="add-form" novalidate autocomplete="off">
        <input id="add-word" type="text" placeholder="Type an English word" aria-label="English word"
          autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done">
        <button class="btn solid" type="submit">Add</button>
      </form>
      <p class="add-err" id="add-err" hidden>Type a word first.</p>
      <p class="hint">The word is saved right away. Its meaning, part of speech and an example are then looked up in free online dictionaries. Anything can be changed by hand.</p>
      <section id="added" aria-live="polite"></section>
    </div>`;
    $('#add-form').addEventListener('submit', e => { e.preventDefault(); addWord(); });
    $('#add-word').addEventListener('input', () => { $('#add-err').hidden = true; });
  }
  renderAdded();
}

function statusHTML() {
  const w = addedId ? byId(addedId) : null;
  const canRename = w && addedLemma && !words.some(x => x.id !== w.id && x.word.toLowerCase() === addedLemma.toLowerCase());
  return `<p class="status ${addedBusy ? 'busy' : ''}" id="lookup-status">${esc(addedStatus)}</p>
    ${addedLemma && w ? `<p class="status" id="lemma-note">These details are for “${esc(addedLemma)}”, the base form of “${esc(w.word)}”.</p>` : ''}
    ${(addedRetry && !addedBusy) || canRename ? `<div class="status-actions">
      ${addedRetry && !addedBusy ? '<button class="text-btn" data-act="retry">Try again</button>' : ''}
      ${canRename ? `<button class="text-btn" data-act="use-lemma">Save as “${esc(addedLemma)}”</button>` : ''}
    </div>` : ''}`;
}
function renderStatus() {
  const s = $('#status-box');
  if (s) s.innerHTML = statusHTML();
}

function renderAdded() {
  const box = $('#added');
  if (!box) return;
  const w = addedId ? byId(addedId) : null;
  if (!w) { box.className = ''; box.innerHTML = ''; return; }
  box.className = 'added';
  box.innerHTML = `
    <div class="added-head"><span class="label">Just added</span><span class="label" id="autosave">Saved automatically</span></div>
    <div id="status-box">${statusHTML()}</div>
    <label class="fld"><span class="label">English word</span>
      <input type="text" class="big" data-field="word" value="${esc(w.word)}" autocapitalize="none" spellcheck="false"></label>
    <label class="fld"><span class="label">Meaning</span>
      <textarea rows="1" data-field="meaning">${esc(w.meaning)}</textarea></label>
    <div class="fld"><span class="label">Part of speech</span>
      <input type="text" data-field="pos" value="${esc(w.pos)}" autocapitalize="none" placeholder="Type or choose below" aria-label="Part of speech">
      <div class="chips">${POS.map(p => `<button type="button" class="chip" data-act="add-pos" data-pos="${p}" aria-pressed="${w.pos === p}">${p}</button>`).join('')}</div>
    </div>
    <label class="fld"><span class="label">Example sentence</span>
      <textarea rows="1" data-field="example" spellcheck="false">${esc(w.example)}</textarea></label>
    <label class="fld"><span class="label">My note</span>
      <textarea rows="2" data-field="note">${esc(w.note)}</textarea></label>`;
  box.querySelectorAll('textarea').forEach(autosize);
  box.oninput = e => {
    const f = e.target.dataset.field;
    if (!f) return;
    if (e.target.tagName === 'TEXTAREA') autosize(e.target);
    if (f === 'pos') syncChips(box, e.target.value);
    queueSave(f, e.target.value);
  };
  box.onfocusout = e => {
    if (e.target.dataset.field === 'word' && !e.target.value.trim()) e.target.value = byId(addedId)?.word || '';
  };
}

// a field typed by hand is no longer "from the dictionary"
function dropSrc(w, field) {
  if (w.src && w.src[field]) { delete w.src[field]; if (!Object.keys(w.src).length) delete w.src; }
}
function queueSave(field, value) {
  const w = byId(addedId);
  if (!w) return;
  const v = value.trim();
  if (field === 'word' && !v) return; // never store an empty word
  if (w[field] !== v) dropSrc(w, field);
  w[field] = v;
  w.updatedAt = Date.now();
  const tag = $('#autosave'); if (tag) tag.textContent = 'Saving…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { save(); const t = $('#autosave'); if (t) t.textContent = 'Saved automatically'; }, 250);
}

function addWord() {
  const input = $('#add-word');
  const text = input.value.trim().replace(/\s+/g, ' ');
  if (!text) { $('#add-err').hidden = false; input.focus(); return; }
  clearTimeout(saveTimer); save(); // flush edits to the previous word
  const dup = words.find(w => w.word.toLowerCase() === text.toLowerCase());
  input.value = '';
  if (dup) {
    addedId = dup.id; addedBusy = false; addedRetry = false; addedLemma = null;
    addedStatus = 'Already in your list. Showing the saved entry.';
    renderAdded();
    return;
  }
  const now = Date.now();
  const w = normalize({ id: uid(), word: text, createdAt: now, updatedAt: now });
  words.push(w);
  save();
  addedId = w.id; addedBusy = true; addedRetry = false; addedLemma = null;
  addedStatus = 'Saved. Looking it up…';
  renderAdded();
  queueLookup(w.id);
}

// Lookups run one at a time, in the order the words were added
// (Tatoeba drops requests when many arrive at once).
let lookupChain = Promise.resolve();
function queueLookup(id) {
  const p = lookupChain.then(() => autofill(id));
  lookupChain = p.catch(() => {});
  return p;
}

const LOOKUP_ERROR = {
  offline: w => ({ text: `You’re offline, so “${w}” was saved without details. Try again when you’re back online, or fill them in yourself.`, retry: true }),
  not_found: w => ({ text: `“${w}” isn’t in the dictionary. The word is saved; fill in the details yourself (and check the spelling).`, retry: false }),
  rate_limit: w => ({ text: `The dictionary is busy (too many requests). “${w}” is saved; try again later or fill in the details yourself.`, retry: true }),
  unavailable: w => ({ text: `The dictionary couldn’t be reached. “${w}” is saved; try again or fill in the details yourself.`, retry: true }),
  invalid_input: w => ({ text: `“${w}” doesn’t look like an English word or phrase, so it wasn’t looked up. It is saved; fill in the details yourself.`, retry: false })
};

// the single call site of window.Wordbook.lookupWord(): fills only the fields that are still empty
async function autofill(id) {
  const w = byId(id);
  if (!w) return;
  if (addedId === id && !addedBusy) { addedBusy = true; addedRetry = false; addedStatus = 'Looking it up…'; renderStatus(); }
  let res = null, kind = null;
  try { res = await window.Wordbook.lookupWord(w.word); }
  catch (e) { kind = (e && LOOKUP_ERROR[e.kind]) ? e.kind : 'unavailable'; }
  const cur = byId(id);
  if (!cur) return;
  let filled = 0, found = 0;
  if (!kind && res && typeof res === 'object') {
    const src = (res.source && typeof res.source === 'object') ? res.source : {};
    for (const f of ['meaning', 'pos', 'example']) {
      const v = str(res[f]);
      if (!v) continue;
      found++;
      if (!cur[f]) {
        cur[f] = v; filled++;
        if (src[f]) { cur.src = normSrc({ ...(cur.src || {}), [f]: src[f] }) || undefined; if (!cur.src) delete cur.src; }
      }
    }
  }
  if (filled) { cur.updatedAt = Date.now(); save(); }
  if (addedId !== id) return;

  addedBusy = false; addedRetry = false;
  addedLemma = (!kind && res && typeof res.lemma === 'string' && res.lemma && res.lemma.toLowerCase() !== cur.word.toLowerCase()) ? res.lemma : null;
  if (kind) {
    const m = LOOKUP_ERROR[kind](cur.word);
    addedStatus = m.text; addedRetry = m.retry;
  } else if (!found) addedStatus = 'The dictionary had nothing for this word. Fill in the details yourself.';
  else if (!filled) addedStatus = 'Your own entries were kept; nothing was overwritten.';
  else if (found < 3) addedStatus = 'Filled in what the dictionary had. Add the rest yourself.';
  else addedStatus = 'Filled in from the dictionary. Edit anything below.';

  // update only the fields the user has not touched; keep focus where it is
  const box = $('#added');
  if (!box || !box.firstElementChild) return renderAdded();
  renderStatus();
  for (const f of ['meaning', 'pos', 'example']) {
    const el = box.querySelector(`[data-field="${f}"]`);
    if (el && !el.value.trim() && cur[f]) { el.value = cur[f]; if (el.tagName === 'TEXTAREA') autosize(el); }
  }
  syncChips(box, cur.pos);
}

function autosize(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }
function syncChips(root, value) {
  const v = String(value || '').trim().toLowerCase();
  root.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.pos === v)));
}

/* ================= Edit overlay (from List) ================= */
let editingId = null;
function openForm(id) {
  const w = byId(id);
  if (!w) return;
  editingId = id;
  pushView('form');
  $('#layer').innerHTML = `<div class="view" id="form-view">
    <div class="view-top"><div class="wrap">
      <button class="top-btn" data-act="cancel">Cancel</button>
      <span class="label">Edit word</span>
      <button class="top-btn right" data-act="save">Save</button>
    </div></div>
    <form class="wrap form" id="form" novalidate autocomplete="off">
      <label class="fld" id="fld-word"><span class="label">English word</span>
        <input type="text" name="word" class="big" value="${esc(w.word)}" autocapitalize="off" spellcheck="false">
        <div class="err" hidden>Enter a word.</div></label>
      <label class="fld"><span class="label">Meaning</span><textarea name="meaning" rows="1">${esc(w.meaning)}</textarea></label>
      <div class="fld"><label class="label" for="pos">Part of speech</label>
        <input type="text" id="pos" name="pos" value="${esc(w.pos)}" autocapitalize="off" placeholder="Type or choose below">
        <div class="chips">${POS.map(p => `<button type="button" class="chip" data-act="pos" data-pos="${p}" aria-pressed="${w.pos === p}">${p}</button>`).join('')}</div></div>
      <label class="fld"><span class="label">Example sentence</span><textarea name="example" rows="1" spellcheck="false">${esc(w.example)}</textarea></label>
      <label class="fld"><span class="label">My note</span><textarea name="note" rows="2">${esc(w.note)}</textarea></label>
      <button type="button" class="toggle-row" data-act="form-learned" aria-pressed="${w.learned}"><span>Learned</span><span class="mark">${ICON.check}</span></button>
      <div class="form-delete"><button type="button" class="text-btn danger" data-act="delete">Delete this word</button></div>
    </form>
  </div>`;
  const view = $('#form-view');
  view.querySelectorAll('textarea').forEach(autosize);
  view.addEventListener('input', e => {
    if (e.target.tagName === 'TEXTAREA') autosize(e.target);
    if (e.target.name === 'pos') syncChips(view, e.target.value);
    if (e.target.name === 'word') { $('#fld-word').classList.remove('invalid'); $('#fld-word .err').hidden = true; }
  });
  $('#form').addEventListener('submit', e => { e.preventDefault(); saveForm(); });
}
function saveForm() {
  const f = $('#form');
  const data = {
    word: f.word.value.trim(), meaning: f.meaning.value.trim(), pos: f.pos.value.trim(),
    example: f.example.value.trim(), note: f.note.value.trim(),
    learned: $('[data-act="form-learned"]').getAttribute('aria-pressed') === 'true'
  };
  if (!data.word) {
    $('#fld-word').classList.add('invalid'); $('#fld-word .err').hidden = false; f.word.focus(); return;
  }
  const target = byId(editingId);
  ['meaning', 'pos', 'example'].forEach(k => { if (target[k] !== data[k]) dropSrc(target, k); });
  Object.assign(target, data, { updatedAt: Date.now() });
  if (!save()) return;
  closeView();
  toast('Saved.');
}

/* ================= Review ================= */
let deck = [], pos = 0, revealed = false, scope = 'notyet';
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function buildDeck() {
  const src = scope === 'notyet' ? words.filter(w => !w.learned) : words.slice();
  deck = shuffle(src.map(w => w.id));
  pos = 0; revealed = false;
}
function enterReview() {
  // keep a session in progress; start a new one when there is none
  deck = deck.filter(id => byId(id));
  if (!deck.length || pos >= deck.length) {
    scope = words.some(w => !w.learned) ? 'notyet' : 'all';
    buildDeck();
  }
}
function meaningHTML(m) {
  if (!m) return '<p class="card-meaning">—</p>';
  const parts = m.split(' / ').map(x => x.trim()).filter(Boolean);
  if (parts.length < 2) return '<p class="card-meaning">' + esc(m) + '</p>';
  return '<ol class="card-senses">' + parts.map(p => '<li>' + esc(p) + '</li>').join('') + '</ol>';
}
function renderReview() {
  while (pos < deck.length && !byId(deck[pos])) pos++;
  const notyet = words.filter(w => !w.learned).length;
  const total = deck.length;
  const finished = pos >= total;
  const w = finished ? null : byId(deck[pos]);
  const pct = total ? Math.min(pos + (finished ? 0 : (revealed ? 1 : 0.5)), total) / total * 100 : 0;

  let main, bar;
  if (!total) {
    main = `<div class="card wrap done"><div class="label">Review</div><h2>Nothing to review.</h2>
      <p>${words.length ? 'Every word is marked as learned. Switch to All to go through them again.' : 'Add a few words from the Add tab first.'}</p></div>`;
    bar = '';
  } else if (finished) {
    main = `<div class="card wrap done"><div class="label">Session complete</div>
      <h2>That’s all ${plural(total, 'word', 'words')}.</h2>
      <p>Shuffle again for another round.</p></div>`;
    bar = `<button class="btn solid" data-act="again">Shuffle again</button>`;
  } else {
    main = `<div class="card wrap">
      <div class="card-no"><span class="label num">${pad(pos + 1)} / ${pad(total)}</span>
        <span class="label">${w.learned ? 'Learned' : 'Not yet'}</span></div>
      <h2 class="card-word">${esc(w.word)}</h2>
      <div class="card-pos">${esc(w.pos)}</div>
      ${Speech.ok ? `<div class="card-say">${speakBtn(w.word, 'Pronounce ' + w.word)}</div>` : ''}
      <div class="card-reveal">
        ${revealed ? `
          <div class="label" style="margin-bottom:6px">Meaning</div>
          ${meaningHTML(w.meaning)}
          ${w.example ? `<div class="card-example"><div class="label">Example</div>
            <div class="example-row"><p class="example">${esc(w.example)}</p>${speakBtn(w.example, 'Read the example aloud')}</div></div>` : ''}
          ${w.note ? `<div class="card-example"><div class="label">My note</div><p class="note">${esc(w.note)}</p></div>` : ''}
        ` : `<p class="card-hint">Say the meaning to yourself, then check.</p>`}
      </div>
    </div>`;
    bar = revealed
      ? `<div class="grade" role="group" aria-label="Mark this word">
          <button class="btn" data-act="grade" data-v="notyet"><span class="mark"></span>Not yet</button>
          <button class="btn solid" data-act="grade" data-v="learned"><span class="mark on">${ICON.check}</span>Learned</button>
        </div>`
      : `<button class="btn solid" data-act="reveal">Show meaning</button>`;
  }
  $('#s-review').innerHTML = `${topBar()}
    <div class="wrap">
      <h1 class="screen-title">Review</h1>
      <div class="scope" role="group" aria-label="Words to review">
        <button class="text-btn" data-act="scope" data-s="notyet" aria-pressed="${scope === 'notyet'}">Not yet &middot; ${notyet}</button>
        <button class="text-btn" data-act="scope" data-s="all" aria-pressed="${scope === 'all'}">All &middot; ${words.length}</button>
      </div>
      <div class="progress"><i style="width:${pct}%"></i></div>
    </div>
    ${main}
    ${bar ? `<div class="review-actions"><div class="wrap">${bar}</div></div>` : ''}`;
}

/* ================= Tab bar: glass capsule with a lifting lens ================= */
const TABS = ['review', 'add', 'list'];
const pill = $('#pill');
const tabbar = $('#tabbar');
const INSET = 4; // gap between the pill and its tab cell
const tabEl = n => tabbar.querySelector(`.tab[data-tab="${n}"]`);
const pillX = n => tabEl(n).offsetLeft + INSET;
const FLAT_SHADOW = '0 0 0 1px rgba(0,0,0,0), inset 0 1px 1px rgba(255,255,255,0), inset 0 -3px 8px rgba(0,0,0,0), 0 6px 18px rgba(0,0,0,0)';
const LENS_SHADOW = '0 0 0 1px rgba(0,0,0,.38), inset 0 1px 1px rgba(255,255,255,.6), inset 0 -3px 8px rgba(0,0,0,.2), 0 6px 18px rgba(0,0,0,.22)';

function tbVars() {
  const cs = getComputedStyle(document.documentElement);
  const n = (k, d) => { const v = parseFloat(cs.getPropertyValue(k)); return isFinite(v) ? v : d; };
  return {
    blur: n('--tb-blur', 16), rim: n('--tb-rim', .24), pill: n('--tb-pill', .16),
    lensScale: n('--tb-lens-scale', 1.18), iconScale: n('--tb-icon-scale', 1.14),
    move: n('--tb-move-ms', 170), lift: n('--tb-lift-ms', 110), hold: n('--tb-hold-ms', 70), settle: n('--tb-settle-ms', 240)
  };
}
// Safari has had trouble with var() inside -webkit-backdrop-filter; write the literal value too
function applyGlass() {
  const v = tbVars();
  const g = tabbar.querySelector('.tb-glass');
  const f = `blur(${v.blur}px) saturate(170%)`;
  g.style.webkitBackdropFilter = f; g.style.backdropFilter = f;
}
function setSelected(name) {
  tabbar.querySelectorAll('.tab').forEach(t => {
    const on = t.dataset.tab === name;
    t.classList.toggle('selected', on);
    if (on) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
  });
}
function layoutPill() {
  const t = tabEl('review');
  pill.style.width = (t.offsetWidth - INSET * 2) + 'px';
  pill.getAnimations().forEach(a => a.cancel());
  tabbar.querySelectorAll('.tab-icon').forEach(i => i.getAnimations().forEach(a => a.cancel()));
  pill.classList.remove('lens');
  if (TABS.includes(current)) { pill.style.transform = `translateX(${pillX(current)}px)`; pill.style.opacity = '1'; }
  else pill.style.opacity = '0';
  setSelected(TABS.includes(current) ? current : null);
}
// run callbacks when an animation's clock passes given times (works when the animation is paused and seeked too)
function atTimes(anim, marks) {
  marks.sort((a, b) => a.t - b.t);
  const tick = () => {
    if (anim.playState === 'idle') return;
    const ct = anim.currentTime || 0;
    while (marks.length && ct >= marks[0].t) marks.shift().fn();
    if (marks.length) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function moveLens(from, to) {
  const fromTab = TABS.includes(from) ? from : null;
  const toTab = TABS.includes(to) ? to : null;
  // start from wherever the pill is right now (a switch can interrupt another)
  const m = new DOMMatrixReadOnly(getComputedStyle(pill).transform === 'none' ? undefined : getComputedStyle(pill).transform);
  const curX = m.m41, curOpacity = parseFloat(getComputedStyle(pill).opacity);
  pill.getAnimations().forEach(a => a.cancel());
  tabbar.querySelectorAll('.tab-icon').forEach(i => i.getAnimations().forEach(a => a.cancel()));
  pill.classList.remove('lens');

  if (!toTab) { // back to Home: the pill simply fades away
    setSelected(null);
    pill.style.transform = `translateX(${curX}px)`;
    const a = pill.animate([{ opacity: curOpacity }, { opacity: 0 }], { duration: reduced() ? 1 : 180, easing: 'ease-out' });
    pill.style.opacity = '0';
    return a;
  }
  const x1 = pillX(toTab);
  if (reduced()) {
    setSelected(toTab);
    pill.style.transform = `translateX(${x1}px)`; pill.style.opacity = '1';
    return null;
  }
  const v = tbVars();
  const x0 = (fromTab || curOpacity > 0.01) ? curX : x1;
  const startOpacity = fromTab ? Math.max(curOpacity, 0) : 0;
  const S = v.lensScale;
  const tMoveStart = v.lift * 0.5;             // the lens starts travelling while it is still lifting
  const tArrive = tMoveStart + v.move;
  const tHoldEnd = tArrive + v.hold;
  const T = tHoldEnd + v.settle;
  const flat = { backgroundColor: `rgba(255,255,255,${v.pill})`, borderColor: 'rgba(255,255,255,0)', boxShadow: FLAT_SHADOW };
  const lens = { backgroundColor: 'rgba(255,255,255,0.07)', borderColor: `rgba(255,255,255,${Math.min(1, v.rim * 2.4)})`, boxShadow: LENS_SHADOW };
  const tf = (x, s) => `translateX(${x}px) scale(${s})`;
  const anim = pill.animate([
    { offset: 0, transform: tf(x0, 1), opacity: startOpacity, ...flat, easing: 'cubic-bezier(.3,.7,.4,1)' },
    { offset: tMoveStart / T, transform: tf(x0, 1 + (S - 1) * 0.75), opacity: 1, ...lens, easing: 'cubic-bezier(.2,.85,.25,1)' },
    { offset: tArrive / T, transform: tf(x1, S), opacity: 1, ...lens, easing: 'linear' },
    { offset: tHoldEnd / T, transform: tf(x1, S), opacity: 1, ...lens, easing: 'cubic-bezier(.4,0,.2,1)' },
    { offset: 1, transform: tf(x1, 1), opacity: 1, ...flat }
  ], { duration: T });
  pill.style.transform = tf(x1, 1); pill.style.opacity = '1';
  pill.classList.add('lens');

  const Si = v.iconScale;
  const toIcon = tabEl(toTab).querySelector('.tab-icon');
  toIcon.animate([
    { offset: 0, transform: 'scale(1)' },
    { offset: (tMoveStart + v.move * 0.45) / T, transform: 'scale(1)', easing: 'cubic-bezier(.2,.8,.3,1)' },
    { offset: tArrive / T, transform: `scale(${Si})` },
    { offset: tHoldEnd / T, transform: `scale(${Si})`, easing: 'cubic-bezier(.4,0,.2,1)' },
    { offset: 1, transform: 'scale(1)' }
  ], { duration: T });
  if (fromTab && fromTab !== toTab) {
    tabEl(fromTab).querySelector('.tab-icon').animate([
      { offset: 0, transform: 'scale(1)', easing: 'cubic-bezier(.2,.8,.3,1)' },
      { offset: tMoveStart / T, transform: `scale(${Si})`, easing: 'ease-in' },
      { offset: (tMoveStart + v.move * 0.5) / T, transform: 'scale(1)' },
      { offset: 1, transform: 'scale(1)' }
    ], { duration: T });
  }
  atTimes(anim, [
    { t: tMoveStart + v.move * 0.55, fn: () => setSelected(toTab) },
    { t: tHoldEnd + v.settle * 0.5, fn: () => pill.classList.remove('lens') }
  ]);
  anim.onfinish = () => pill.classList.remove('lens');
  return anim;
}

/* ================= Screens ================= */
let current = 'home';
const screenEl = n => $('#s-' + n);
function renderScreen(n) {
  if (n === 'home') renderHome();
  else if (n === 'review') { enterReview(); renderReview(); }
  else if (n === 'add') renderAdd();
  else if (n === 'list') renderList();
}
function crossfade(a, b) {
  const d = reduced() ? 1 : 260;
  a.getAnimations().forEach(x => x.cancel());
  b.getAnimations().forEach(x => x.cancel());
  b.hidden = false;
  b.style.zIndex = '2'; a.style.zIndex = '1';
  b.animate([{ opacity: 0 }, { opacity: 1 }], { duration: d, easing: 'ease-out' });
  const out = a.animate([{ opacity: 1 }, { opacity: 0 }], { duration: d * 0.85, easing: 'ease-in', fill: 'forwards' });
  out.onfinish = () => {
    if (current !== a.dataset.screen) a.hidden = true;
    out.cancel();
    a.style.zIndex = ''; b.style.zIndex = '';
  };
}
function go(name) {
  if (name === current) {
    const el = screenEl(name);
    if (el.scrollTop > 0) el.scrollTo({ top: 0, behavior: reduced() ? 'auto' : 'smooth' });
    return;
  }
  clearToast();
  const from = current;
  current = name;
  renderScreen(name);
  crossfade(screenEl(from), screenEl(name));
  moveLens(from, name);
  if (name === 'add' && !words.length) setTimeout(() => { const i = $('#add-word'); if (i) i.focus(); }, 300);
}
function rerenderCurrent() {
  renderScreen(current);
}

/* ================= Overlay history ================= */
let overlay = null;
function pushView(v) {
  overlay = v;
  clearToast();
  try { history.pushState({ view: v }, ''); } catch (e) {}
}
function closeView() {
  if (history.state && history.state.view) history.back();
  else teardown();
}
function teardown() {
  overlay = null;
  editingId = null;
  $('#layer').innerHTML = '';
  rerenderCurrent();
}
window.addEventListener('popstate', () => { if (overlay) teardown(); });

/* ================= Actions ================= */
async function confirmDelete(id) {
  const w = byId(id);
  if (!w) return;
  const ok = await dialog({
    label: 'Delete',
    title: `Delete “${w.word}”?`,
    body: 'This removes the word and its notes from this device. It cannot be undone.',
    actions: [{ text: 'Delete', style: 'danger', value: true }, { text: 'Cancel', value: false }]
  });
  if (!ok) return;
  words = words.filter(x => x.id !== id);
  open.delete(id);
  if (addedId === id) addedId = null;
  save();
  if (overlay === 'form') closeView(); else rerenderCurrent();
  toast(`Deleted “${w.word}”.`);
}

function exportJSON() {
  const payload = { app: 'wordbook', version: 1, exportedAt: new Date().toISOString(), count: words.length, words, days: [...days].sort() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `wordbook-${dayKey(new Date())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast(`Exported ${plural(words.length, 'word', 'words')}.`);
}

async function importFile(file) {
  let data;
  try { data = JSON.parse(await file.text()); }
  catch (e) { return dialog({ label: 'Import', title: 'This file could not be read.', body: 'Choose a JSON file exported from Wordbook.', actions: [{ text: 'OK', style: 'solid', value: null }] }); }
  const list = Array.isArray(data) ? data : (data && Array.isArray(data.words) ? data.words : null);
  const incoming = (list || []).map(normalize).filter(Boolean);
  if (!incoming.length) {
    return dialog({ label: 'Import', title: 'No words found in this file.', body: 'Choose a JSON file exported from Wordbook.', actions: [{ text: 'OK', style: 'solid', value: null }] });
  }
  let mode = 'replace';
  if (words.length) {
    mode = await dialog({
      label: 'Import',
      title: `Import ${plural(incoming.length, 'word', 'words')}?`,
      body: `Merge keeps the ${plural(words.length, 'word', 'words')} on this device and adds or updates from the file. Replace discards them and uses the file only.`,
      actions: [
        { text: 'Merge', style: 'solid', value: 'merge' },
        { text: 'Replace', value: 'replace' },
        { text: 'Cancel', value: null }
      ]
    });
    if (!mode) return;
  }
  if (mode === 'merge') {
    const map = new Map(words.map(w => [w.id, w]));
    incoming.forEach(w => map.set(w.id, w));
    words = [...map.values()];
  } else {
    words = incoming;
  }
  // review days travel with the file (older exports have none); they are only ever added
  if (data && Array.isArray(data.days)) {
    data.days.forEach(d => { if (typeof d === 'string' && DAY_RE.test(d)) days.add(d); });
    saveDays();
  }
  open.clear();
  save();
  rerenderCurrent();
  toast(`Imported ${plural(incoming.length, 'word', 'words')}.`);
}

document.addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (tab) { go(tab.dataset.tab); return; }
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  const li = b.closest('.entry');
  const id = li ? li.dataset.id : editingId;
  switch (act) {
    case 'home': go('home'); break;
    case 'speak': Speech.speak(b.dataset.text, b); break;
    case 'cal': calMonth = (() => { const d = new Date(calMonth.y, calMonth.m + Number(b.dataset.d), 1); return { y: d.getFullYear(), m: d.getMonth() }; })(); renderHome(); break;
    case 'cal-today': calMonth = null; renderHome(); break;
    case 'filter': filter = b.dataset.f; renderList(); break;
    case 'clear': { query = ''; renderList(); const q = $('#q'); if (q) q.focus(); break; }
    case 'toggle': open.has(id) ? open.delete(id) : open.add(id); renderResults(); break;
    case 'learn': { const w = byId(id); w.learned = !w.learned; w.updatedAt = Date.now(); save(); renderList(); break; }
    case 'edit': openForm(id); break;
    case 'delete': confirmDelete(id); break;
    case 'cancel': closeView(); break;
    case 'save': saveForm(); break;
    case 'pos': { const input = $('#pos'); input.value = b.getAttribute('aria-pressed') === 'true' ? '' : b.dataset.pos; syncChips($('#form-view'), input.value); break; }
    case 'add-pos': {
      const box = $('#added'); const input = box.querySelector('[data-field="pos"]');
      input.value = b.getAttribute('aria-pressed') === 'true' ? '' : b.dataset.pos;
      syncChips(box, input.value); queueSave('pos', input.value); break;
    }
    case 'retry': if (addedId) { addedRetry = false; queueLookup(addedId); } break;
    case 'use-lemma': {
      const w = byId(addedId);
      if (w && addedLemma && !words.some(x => x.id !== w.id && x.word.toLowerCase() === addedLemma.toLowerCase())) {
        w.word = addedLemma; w.updatedAt = Date.now(); save();
        addedStatus = `Saved as “${addedLemma}”.`; addedLemma = null; renderAdded();
      }
      break;
    }
    case 'form-learned': b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true')); break;
    case 'reveal': revealed = true; markToday(); renderReview(); break;
    case 'grade': {
      const w = byId(deck[pos]);
      if (w) { const v = b.dataset.v === 'learned'; if (w.learned !== v) { w.learned = v; w.updatedAt = Date.now(); save(); } }
      pos++; revealed = false; renderReview(); break;
    }
    case 'again': buildDeck(); renderReview(); break;
    case 'scope': scope = b.dataset.s; buildDeck(); renderReview(); break;
    case 'export': exportJSON(); break;
    case 'import': $('#file').value = ''; $('#file').click(); break;
  }
});
document.addEventListener('input', e => { if (e.target.id === 'q') { query = e.target.value; renderResults(); } });
$('#file').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) importFile(f); });
document.addEventListener('keydown', e => {
  if (current !== 'review' || overlay || $('.scrim') || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key === ' ' || e.key === 'Enter') { const b = $('[data-act="reveal"]'); if (b) { e.preventDefault(); b.click(); } }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    const b = $(`[data-act="grade"][data-v="${e.key === 'ArrowRight' ? 'learned' : 'notyet'}"]`);
    if (b) { e.preventDefault(); b.click(); }
  }
});
window.addEventListener('storage', e => {
  if (e.key === KEY) words = load();
  if (e.key === DAYS_KEY) days = loadDays();
  if (e.key === KEY || e.key === DAYS_KEY) rerenderCurrent();
});
// the app can stay open across midnight: refresh the streak when it comes back
document.addEventListener('visibilitychange', () => { if (!document.hidden && current === 'home' && !overlay) renderHome(); });
window.addEventListener('resize', layoutPill);

try { history.replaceState({}, ''); } catch (e) {}
words = load();
days = loadDays();
applyGlass();
renderHome();
layoutPill();

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
</script>
</body>
